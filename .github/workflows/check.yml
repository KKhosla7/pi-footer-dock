name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
        # The oldest and the newest Pi the package supports (the lockfile pins the oldest).
        pi: ['1.2.0', '1.3.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use Pi ${{ matrix.pi }}
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-tui@${{ matrix.pi }}
      # Formatting, lint, types and architecture run once; the tests run on every Node version.
      - run: npm run check
        if: matrix.node == '24'
      - run: npm test
        if: matrix.node != '24'
      - run: npm run pack:check
        if: matrix.node == '24'
