name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
        # The oldest and the newest Pi the package supports (the lockfile pins the oldest).
        pi: ['1.2.0', '1.3.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use Pi ${{ matrix.pi }}
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-tui@${{ matrix.pi }}
      # Formatting, lint, types and architecture run once; the tests run on every Node version.
      - run: npm run check
        if: matrix.node == '24'
      - run: npm test
        if: matrix.node != '24'
      - run: npm run pack:check
        if: matrix.node == '24'
  secrets:
    # No credentials in the repository: gitleaks over the whole history on every pull request and push.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version, checked against its published checksum)
        run: |
          version=8.30.1
          file="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${file}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${file}" | sha256sum -c -
          tar -xzf "${file}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: scripts/check-secrets.sh history
      - run: scripts/check-secrets.sh tree
  hygiene:
    # No personal details in the public repository: commit addresses and trailers, emails and home-folder paths in files.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/check-hygiene.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
