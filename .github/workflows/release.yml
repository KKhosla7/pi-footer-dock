name: Release
# Publishes to npm when a version tag is pushed, with a provenance statement that links the
# package to this repository and this run, then creates the GitHub release from CHANGELOG.md.
# Publishing uses npm trusted publishing (OIDC): there is no npm token or secret anywhere. npm must
# list this repository and this workflow as the package's trusted publisher; see RELEASING.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: write # to create the GitHub release
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run pack:check
      - name: The tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: The changelog has notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: npm is new enough for trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - run: npm publish --provenance --access public
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Footer Dock ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --latest
        env:
          GH_TOKEN: ${{ github.token }}
