name: Release
# Publishes to npm when a version tag is pushed, with a provenance statement that links the
# package to this repository and this run, then creates the GitHub release from CHANGELOG.md.
# Publishing uses npm trusted publishing (OIDC): there is no npm token or secret anywhere. npm must
# list this repository and this workflow as the package's trusted publisher; see RELEASING.md.
# The workflow only STAGES the release (`npm stage publish`, the one action a trusted publisher may
# always do). Nothing is public until the maintainer approves the staged version on npm with
# two-factor authentication: a human decision for every release.
# Started by hand (Actions → Release → Run workflow) it publishes nothing: it runs the same steps and an
# `npm publish --dry-run`, which also performs the OIDC exchange with npm, so the trusted-publisher entry
# can be proven without releasing. Only the OIDC lines of npm's log are shown.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write # to create the GitHub release
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run pack:check
      - name: The tag must match package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: The changelog has notes for this version
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: npm is new enough for trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - name: Show who GitHub says is publishing (the public identity claims npm compares; never the token)
        run: |
          node --input-type=module -e '
            const url = `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org`;
            const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
            const claims = JSON.parse(Buffer.from((await response.json()).value.split(".")[1], "base64url").toString());
            for (const key of ["repository", "repository_owner", "repository_id", "repository_owner_id", "workflow_ref", "job_workflow_ref", "ref", "ref_type", "environment", "sub"])
              console.log(`${key}: ${claims[key]}`);
          '
      - name: Stage the release on npm (a dry run when started by hand)
        run: |
          flags=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then flags="--dry-run"; fi
          status=0
          npm stage publish . --provenance --access public $flags --loglevel verbose > "$RUNNER_TEMP/publish.log" 2>&1 || status=$?
          grep -E "oidc|npm notice (Publishing|publish)|npm error|npm warn|^\+ " "$RUNNER_TEMP/publish.log" || true
          exit $status
      - name: GitHub release as a draft (publish it after approving the version on npm)
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Footer Dock ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --latest --draft
        env:
          GH_TOKEN: ${{ github.token }}
