name: Release rehearsal
# Run by hand (Actions → Release rehearsal → Run workflow) before tagging a release. It does everything
# the release does except publish: the checks, the package inspection, the release-notes lookup, the
# npm version needed for trusted publishing, and an `npm publish --dry-run`. Whether npm accepts the
# trusted publisher can only be proven by a real release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run pack:check
      - name: npm is new enough for trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - name: The name is free, or already ours
        run: npm view "$(node -p "require('./package.json').name")" version 2>&1 | head -1 || true
      - name: The changelog has notes for the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" && echo "release notes found for $version"
      - name: Publish dry run (skipped when this version is already on npm)
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already published; bump the version to rehearse the next release"
          else
            npm publish --dry-run --access public
          fi
