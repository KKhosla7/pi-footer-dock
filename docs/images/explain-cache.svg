<svg xmlns="http://www.w3.org/2000/svg" width="1011" height="622" viewBox="0 0 1011 622" role="img" aria-label="The cache explanation">
  <title>The cache explanation</title>
  <rect width="1011" height="622" rx="10" fill="#14161a"/>
  <circle cx="22" cy="19" r="5" fill="#f07178"/><circle cx="40" cy="19" r="5" fill="#e5c07b"/><circle cx="58" cy="19" r="5" fill="#7ed38b"/>
  <g font-family="'DejaVu Sans Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="14">
  <text x="18" y="59" xml:space="preserve"><tspan fill="rgb(72,78,90)">────────────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="18" y="79" xml:space="preserve"><tspan fill="rgb(180,160,229)" font-weight="bold"> Footer Dock › About Cache</tspan></text>
  <text x="18" y="99" xml:space="preserve"></text>
  <text x="18" y="119" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Last response</tspan><tspan fill="#d4d6da">  </tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="#d4d6da">  </tspan><tspan fill="rgb(126,211,139)">98.4% reused</tspan></text>
  <text x="18" y="139" xml:space="preserve"></text>
  <text x="18" y="159" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Session      </tspan><tspan fill="#d4d6da">  </tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="rgb(105,112,124)">░</tspan><tspan fill="rgb(105,112,124)">░</tspan><tspan fill="#d4d6da">  </tspan><tspan fill="rgb(126,211,139)">92.1% reused</tspan></text>
  <text x="18" y="179" xml:space="preserve"></text>
  <text x="18" y="199" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(126,211,139)">Now: available</tspan></text>
  <text x="18" y="219" xml:space="preserve"></text>
  <text x="18" y="239" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(180,160,229)" font-weight="bold">Last response</tspan></text>
  <text x="18" y="259" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(126,211,139)">███████████████████████████████████████</tspan><tspan fill="rgb(229,192,123)">▓</tspan></text>
  <text x="18" y="279" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(126,211,139)">█</tspan><tspan fill="#d4d6da"> read 146k </tspan><tspan fill="rgb(105,112,124)">98%</tspan><tspan fill="#d4d6da">   </tspan><tspan fill="rgb(229,192,123)">▓</tspan><tspan fill="#d4d6da"> uncached 2.4k </tspan><tspan fill="rgb(105,112,124)">2%</tspan></text>
  <text x="18" y="299" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Prompt     </tspan><tspan fill="#d4d6da">  148.4k tokens  </tspan><tspan fill="rgb(105,112,124)">uncached + read + written</tspan></text>
  <text x="18" y="319" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Read       </tspan><tspan fill="#d4d6da">  </tspan><tspan fill="rgb(126,211,139)">146k tokens</tspan></text>
  <text x="18" y="339" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Written    </tspan><tspan fill="#d4d6da">  not reported  </tspan><tspan fill="rgb(105,112,124)">only some services behind this API send writes</tspan></text>
  <text x="18" y="359" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Idle before</tspan><tspan fill="#d4d6da">  25s  </tspan><tspan fill="rgb(105,112,124)">since the previous response ended</tspan></text>
  <text x="18" y="379" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Lifetime   </tspan><tspan fill="#d4d6da">  not declared  </tspan><tspan fill="rgb(105,112,124)">this model gives no cache lifetime</tspan></text>
  <text x="18" y="399" xml:space="preserve"></text>
  <text x="18" y="419" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(180,160,229)" font-weight="bold">This session</tspan></text>
  <text x="18" y="439" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Reuse</tspan><tspan fill="#d4d6da">  92.1%  </tspan><tspan fill="rgb(105,112,124)">21.4M read of 23.2M prompt tokens</tspan></text>
  <text x="18" y="459" xml:space="preserve"></text>
  <text x="18" y="479" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(180,160,229)" font-weight="bold">Over time</tspan></text>
  <text x="18" y="499" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Period</tspan><tspan fill="#d4d6da">  this month  </tspan><tspan fill="rgb(105,112,124)">press d, w or m for today, this week or this month</tspan></text>
  <text x="18" y="519" xml:space="preserve"><tspan fill="#d4d6da"> </tspan><tspan fill="rgb(160,166,176)">Reuse</tspan><tspan fill="#d4d6da">  96%  </tspan><tspan fill="rgb(105,112,124)">64.4M read of 67.2M prompt tokens</tspan></text>
  <text x="18" y="539" xml:space="preserve"></text>
  <text x="18" y="559" xml:space="preserve"></text>
  <text x="18" y="579" xml:space="preserve"><tspan fill="rgb(105,112,124)">  ↑/↓ scroll · d/w/m period · Esc to close  (1-12/36)</tspan></text>
  <text x="18" y="599" xml:space="preserve"><tspan fill="rgb(72,78,90)">────────────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
  </g>
</svg>
